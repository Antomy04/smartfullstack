<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="jobapp.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Job Application Form</h2>
    <table border="1">

        <fieldset>
            <legend>PERSONAL-INFO</legend>
            <form id="form" action="/submit">
                <label id="field" for="name">First Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
                <br>

                <label id="field" for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" placeholder="Your Last Name" required>
                <br>

                <label id="field" for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required>
                <br>
                <label id="field" for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="Your Phone" required>
                <br>
                
            </form>
        </fieldset>

    </table>

</body>
</html>.
